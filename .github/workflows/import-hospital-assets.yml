name: Import licensed hospital assets

on:
  push:
    branches: [clinic-dev]
    paths:
      - ".github/workflows/import-hospital-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: clinic-dev
          fetch-depth: 0
      - name: Download and inspect Shuriken Hospital kit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/therason-hospital src/assets/clinic-kit/hospital
          curl --fail --location --retry 3 --retry-delay 2 --user-agent "THERASON-CLINIC-asset-import/1.0" "https://shuriken.studio/kits/hospital/download" --output /tmp/hospital-kit.zip
          file /tmp/hospital-kit.zip
          unzip -t /tmp/hospital-kit.zip
          unzip -q /tmp/hospital-kit.zip -d /tmp/therason-hospital
          find /tmp/therason-hospital -type f -iname '*.glb' -print
          test "$(find /tmp/therason-hospital -type f -iname '*.glb' | wc -l)" -ge 1
          find /tmp/therason-hospital -type f -iname '*.glb' -exec cp {} src/assets/clinic-kit/hospital/ \;
          cat > src/assets/clinic-kit/hospital/ASSET-SOURCES.md <<'EOF'
          # Hospital kit asset sources

          Source: Shuriken Studio — https://shuriken.studio/kits/hospital
          License: Shuriken Studio Free Model License, version 2026-10-25
          License terms: https://shuriken.studio/legal/models

          These GLB models are included as components of the THERASON CLINIC game project.
          The license permits use and modification in games and other projects, including commercial projects, without attribution.
          The standalone model files must not be redistributed or offered for download separately from the project.
          Keep this notice with the assets.
          EOF
          echo "Imported $(find src/assets/clinic-kit/hospital -type f -iname '*.glb' | wc -l) GLB models."
      - name: Import matching CC0 management-game props
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/assets/clinic-kit/management-sim src/assets/characters
          base="https://cdn.3dassets.dev/assets"
          curl --fail --location --retry 3 "$base/23608/v1/model.glb" --output src/assets/clinic-kit/management-sim/examination-couch.glb
          curl --fail --location --retry 3 "$base/23627/v1/model.glb" --output src/assets/clinic-kit/management-sim/reception-desk.glb
          curl --fail --location --retry 3 "$base/23633/v1/model.glb" --output src/assets/clinic-kit/management-sim/waiting-bench-two-seat.glb
          curl --fail --location --retry 3 "$base/23599/v1/model.glb" --output src/assets/clinic-kit/management-sim/privacy-screen.glb
          curl --fail --location --retry 3 "$base/23600/v1/model.glb" --output src/assets/clinic-kit/management-sim/wheelchair.glb
          curl --fail --location --retry 3 "$base/23593/v1/model.glb" --output src/assets/clinic-kit/management-sim/bedside-cabinet.glb
          curl --fail --location --retry 3 "https://gobkit.com/freebies/human002/Receptionist.glb" --output src/assets/characters/Receptionist.glb
          curl --fail --location --retry 3 "https://gobkit.com/freebies/human005/WhiteCoatDoctor.glb" --output src/assets/characters/Physiotherapist.glb
          test "$(head -c 4 src/assets/characters/Receptionist.glb)" = "glTF"
          test "$(head -c 4 src/assets/characters/Physiotherapist.glb)" = "glTF"
          test "$(stat -c%s src/assets/characters/Physiotherapist.glb)" -gt 1000
          test "$(stat -c%s src/assets/characters/Receptionist.glb)" -gt 1000
          for asset in src/assets/clinic-kit/management-sim/*.glb; do
            test "$(head -c 4 "$asset")" = "glTF"
            test "$(stat -c%s "$asset")" -gt 1000
          done
          cat > src/assets/clinic-kit/management-sim/ASSET-SOURCES.md <<'EOF'
          # Matching management-simulation assets

          Source: 3DAssets.dev — Hospital Wards and Clinic Operations
          Pack: https://3dassets.dev/packs/hospital-wards-and-clinic-operations
          Manifest: https://3dassets.dev/api/v1/packs/hospital-wards-and-clinic-operations
          Licence: CC0 1.0 Universal — commercial use and modification permitted; attribution not required.
          Art direction: shared stylized eight-colour palette, metre scale, +Y up, designed for a 30-degree overhead management camera.

          Imported individual assets:
          - Examination Couch — https://cdn.3dassets.dev/assets/23608/v1/model.glb
          - Reception Desk — https://cdn.3dassets.dev/assets/23627/v1/model.glb
          - Waiting Bench Two Seat — https://cdn.3dassets.dev/assets/23633/v1/model.glb
          - Privacy Screen — https://cdn.3dassets.dev/assets/23599/v1/model.glb
          - Wheelchair — https://cdn.3dassets.dev/assets/23600/v1/model.glb
          - Bedside Cabinet — https://cdn.3dassets.dev/assets/23593/v1/model.glb

          Optional receptionist character:
          - Gobkit Receptionist — https://gobkit.com/freebies/human002/Receptionist.glb
          - License: CC0 1.0 Universal; rigged and animated with Idle/Walk clips.

          Only the individual GLB props needed by this physiotherapy clinic are included; the unrelated full-hospital starter scene is not used.
          EOF
      - name: Commit imported assets to clinic-dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf public/assets/clinic-kit/hospital
          git add src/assets/clinic-kit/hospital src/assets/clinic-kit/management-sim src/assets/characters/Receptionist.glb src/assets/characters/Physiotherapist.glb
          if git diff --cached --quiet; then
            echo "No new asset changes."
            exit 0
          fi
          git commit -m "Import licensed hospital GLB assets"
          git fetch origin clinic-dev
          git rebase origin/clinic-dev
          git push origin HEAD:clinic-dev
